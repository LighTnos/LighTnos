  <text x="98" y="398" font-family="JetBrains Mono, monospace" font-size="16" fill="#EAF0FA">2. optimize architecture for scaling</text>
  <text x="98" y="426" font-family="JetBrains Mono, monospace" font-size="16" fill="#EAF0FA">3. strengthen python + ml capabilities</text>
