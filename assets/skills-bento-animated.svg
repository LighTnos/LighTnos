<svg width="1200" height="560" viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111726"/>
      <stop offset="100%" stop-color="#0B0F18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C89B4A"/>
      <stop offset="100%" stop-color="#7B5121"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#59D6FF"/>
      <stop offset="100%" stop-color="#2A88AA"/>
    </linearGradient>
  </defs>

  <rect x="26" y="26" width="1148" height="508" rx="30" fill="#0A0C11" stroke="#1F2940"/>
  <text x="72" y="74" font-family="JetBrains Mono, monospace" font-size="20" fill="#C89B4A">BENTO_MATRIX // animation:high</text>

  <g>
    <rect x="72" y="100" width="340" height="180" rx="22" fill="url(#panel)" stroke="#28334D"/>
    <rect x="92" y="122" width="170" height="26" rx="13" fill="url(#gold)"/>
    <text x="177" y="140" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#0B0D12">FRONTEND</text>
    <text x="92" y="182" font-family="JetBrains Mono, monospace" font-size="16" fill="#E8ECF5">React</text>
    <text x="92" y="210" font-family="JetBrains Mono, monospace" font-size="16" fill="#E8ECF5">Tailwind CSS</text>
    <text x="92" y="238" font-family="JetBrains Mono, monospace" font-size="16" fill="#E8ECF5">HTML · CSS · Bootstrap</text>
    <rect x="92" y="254" width="280" height="8" rx="4" fill="#182033"/>
    <rect x="92" y="254" width="45" height="8" rx="4" fill="url(#cyan)">
      <animate attributeName="width" values="45;250;45" dur="2.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g>
    <rect x="430" y="100" width="340" height="180" rx="22" fill="url(#panel)" stroke="#28334D"/>
    <rect x="450" y="122" width="170" height="26" rx="13" fill="url(#cyan)"/>
    <text x="535" y="140" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#0B0D12">BACKEND</text>
    <text x="450" y="182" font-family="JetBrains Mono, monospace" font-size="16" fill="#E8ECF5">Node.js · Express</text>
    <text x="450" y="210" font-family="JetBrains Mono, monospace" font-size="16" fill="#E8ECF5">MongoDB</text>
    <text x="450" y="238" font-family="JetBrains Mono, monospace" font-size="16" fill="#E8ECF5">REST APIs</text>
    <rect x="450" y="254" width="280" height="8" rx="4" fill="#182033"/>
    <rect x="450" y="254" width="45" height="8" rx="4" fill="url(#gold)">
      <animate attributeName="width" values="45;265;45" dur="2.8s" begin="0.35s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g>
    <rect x="788" y="100" width="340" height="180" rx="22" fill="url(#panel)" stroke="#28334D"/>
    <rect x="808" y="122" width="170" height="26" rx="13" fill="url(#gold)"/>
    <text x="893" y="140" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#0B0D12">TOOLING</text>
    <text x="808" y="182" font-family="JetBrains Mono, monospace" font-size="16" fill="#E8ECF5">Git · GitHub</text>
    <text x="808" y="210" font-family="JetBrains Mono, monospace" font-size="16" fill="#E8ECF5">VS Code</text>
    <text x="808" y="238" font-family="JetBrains Mono, monospace" font-size="16" fill="#E8ECF5">Java · C</text>
    <rect x="808" y="254" width="280" height="8" rx="4" fill="#182033"/>
    <rect x="808" y="254" width="45" height="8" rx="4" fill="url(#cyan)">
      <animate attributeName="width" values="45;235;45" dur="2.8s" begin="0.7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g>
    <rect x="72" y="304" width="520" height="198" rx="22" fill="url(#panel)" stroke="#28334D"/>
    <text x="98" y="340" font-family="JetBrains Mono, monospace" font-size="17" fill="#59D6FF">$ current_mission</text>
    <text x="98" y="372" font-family="JetBrains Mono, monospace" font-size="16" fill="#E8ECF5">ship production-grade features</text>
    <text x="98" y="400" font-family="JetBrains Mono, monospace" font-size="16" fill="#E8ECF5">optimize architecture + maintainability</text>
    <text x="98" y="428" font-family="JetBrains Mono, monospace" font-size="16" fill="#E8ECF5">grow python + ml capability</text>
    <text x="98" y="466" font-family="JetBrains Mono, monospace" font-size="14" fill="#C89B4A">state: focused / shipping / improving</text>
  </g>

  <g>
    <rect x="610" y="304" width="518" height="198" rx="22" fill="url(#panel)" stroke="#28334D"/>
    <text x="636" y="340" font-family="JetBrains Mono, monospace" font-size="17" fill="#C89B4A">$ ui_sync</text>
    <text x="636" y="372" font-family="JetBrains Mono, monospace" font-size="16" fill="#E8ECF5">palette: obsidian + cyan + whiskey gold</text>
    <text x="636" y="400" font-family="JetBrains Mono, monospace" font-size="16" fill="#E8ECF5">typography: mono terminal system</text>
    <text x="636" y="428" font-family="JetBrains Mono, monospace" font-size="16" fill="#E8ECF5">layout: centered web-dashboard bento</text>
    <rect x="636" y="454" width="460" height="12" rx="6" fill="#182033"/>
    <rect x="636" y="454" width="80" height="12" rx="6" fill="url(#cyan)">
      <animate attributeName="width" values="80;440;80" dur="3.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
