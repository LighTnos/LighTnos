<svg width="1200" height="560" viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101521"/>
      <stop offset="100%" stop-color="#0A0D14"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E3B969"/>
      <stop offset="100%" stop-color="#9A6425"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57D6FF"/>
      <stop offset="100%" stop-color="#2E8FB4"/>
    </linearGradient>
  </defs>

  <rect x="24" y="24" width="1152" height="512" rx="30" fill="#0B0D12" stroke="#20293D"/>
  <text x="72" y="76" font-family="JetBrains Mono, monospace" font-size="20" fill="#E3B969">SKILLS_BENTO // synced-mode:on</text>

  <g>
    <rect x="72" y="104" width="340" height="176" rx="22" fill="url(#panel)" stroke="#28324A"/>
    <rect x="92" y="124" width="168" height="26" rx="13" fill="url(#gold)"/>
    <text x="176" y="142" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#0B0D12">FRONTEND</text>
    <text x="92" y="181" font-family="JetBrains Mono, monospace" font-size="16" fill="#E7EAF2">React</text>
    <text x="92" y="208" font-family="JetBrains Mono, monospace" font-size="16" fill="#E7EAF2">Tailwind CSS</text>
    <text x="92" y="235" font-family="JetBrains Mono, monospace" font-size="16" fill="#E7EAF2">HTML · CSS · Bootstrap</text>
    <rect x="92" y="250" width="280" height="8" rx="4" fill="#1A2234"/>
    <rect x="92" y="250" width="40" height="8" rx="4" fill="#57D6FF">
      <animate attributeName="width" values="40;250;40" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g>
    <rect x="430" y="104" width="340" height="176" rx="22" fill="url(#panel)" stroke="#28324A"/>
    <rect x="450" y="124" width="168" height="26" rx="13" fill="url(#cyan)"/>
    <text x="534" y="142" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#0B0D12">BACKEND</text>
    <text x="450" y="181" font-family="JetBrains Mono, monospace" font-size="16" fill="#E7EAF2">Node.js · Express</text>
    <text x="450" y="208" font-family="JetBrains Mono, monospace" font-size="16" fill="#E7EAF2">MongoDB</text>
    <text x="450" y="235" font-family="JetBrains Mono, monospace" font-size="16" fill="#E7EAF2">REST APIs</text>
    <rect x="450" y="250" width="280" height="8" rx="4" fill="#1A2234"/>
    <rect x="450" y="250" width="40" height="8" rx="4" fill="#E3B969">
      <animate attributeName="width" values="40;260;40" dur="3s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g>
    <rect x="788" y="104" width="340" height="176" rx="22" fill="url(#panel)" stroke="#28324A"/>
    <rect x="808" y="124" width="168" height="26" rx="13" fill="url(#gold)"/>
    <text x="892" y="142" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#0B0D12">TOOLING</text>
    <text x="808" y="181" font-family="JetBrains Mono, monospace" font-size="16" fill="#E7EAF2">Git · GitHub</text>
    <text x="808" y="208" font-family="JetBrains Mono, monospace" font-size="16" fill="#E7EAF2">VS Code</text>
    <text x="808" y="235" font-family="JetBrains Mono, monospace" font-size="16" fill="#E7EAF2">Java · C</text>
    <rect x="808" y="250" width="280" height="8" rx="4" fill="#1A2234"/>
    <rect x="808" y="250" width="40" height="8" rx="4" fill="#57D6FF">
      <animate attributeName="width" values="40;230;40" dur="3s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g>
    <rect x="72" y="302" width="520" height="196" rx="22" fill="url(#panel)" stroke="#28324A"/>
    <text x="98" y="338" font-family="JetBrains Mono, monospace" font-size="17" fill="#57D6FF">$ current_mission</text>
    <text x="98" y="370" font-family="JetBrains Mono, monospace" font-size="16" fill="#E7EAF2">ship reliable full-stack features</text>
    <text x="98" y="398" font-family="JetBrains Mono, monospace" font-size="16" fill="#E7EAF2">improve architecture + maintainability</text>
    <text x="98" y="426" font-family="JetBrains Mono, monospace" font-size="16" fill="#E7EAF2">learn python for applied ml workflows</text>
    <text x="98" y="466" font-family="JetBrains Mono, monospace" font-size="14" fill="#E3B969">status: focused / consistent / shipping</text>
  </g>

  <g>
    <rect x="610" y="302" width="518" height="196" rx="22" fill="url(#panel)" stroke="#28324A"/>
    <text x="636" y="338" font-family="JetBrains Mono, monospace" font-size="17" fill="#E3B969">$ sync_visuals</text>
    <text x="636" y="370" font-family="JetBrains Mono, monospace" font-size="16" fill="#E7EAF2">palette: amber + neon cyan + obsidian</text>
    <text x="636" y="398" font-family="JetBrains Mono, monospace" font-size="16" fill="#E7EAF2">typography: jetbrains mono</text>
    <text x="636" y="426" font-family="JetBrains Mono, monospace" font-size="16" fill="#E7EAF2">layout: centered bento composition</text>

    <rect x="636" y="454" width="460" height="12" rx="6" fill="#1A2234"/>
    <rect x="636" y="454" width="80" height="12" rx="6" fill="url(#cyan)">
      <animate attributeName="width" values="80;440;80" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
