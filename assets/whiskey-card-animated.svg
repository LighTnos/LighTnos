  <text x="750" y="560" font-family="JetBrains Mono, monospace" font-size="18" fill="#DDAA4B">WHISKEY • CODE • FOCUS</text>

  <circle cx="1040" cy="112" r="3.2" fill="#57D6FF">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1078" cy="136" r="2.8" fill="#DDAA4B">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1102" cy="106" r="2.4" fill="#57D6FF">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
