<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C0F17"/>
      <stop offset="100%" stop-color="#07090D"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD38A"/>
      <stop offset="100%" stop-color="#8A5A1C"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFC66B"/>
      <stop offset="100%" stop-color="#9F530E"/>
    </linearGradient>
    <filter id="blurGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect x="90" y="70" width="1020" height="560" rx="30" fill="url(#bg)" stroke="url(#edge)" stroke-width="2"/>

  <rect x="130" y="110" width="420" height="28" rx="14" fill="#121622"/>
  <text x="340" y="129" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#F5C16C" letter-spacing="1">NIGHT BUILD RESERVE</text>

  <text x="130" y="190" font-family="JetBrains Mono, monospace" font-size="58" fill="#ECEEF2">UDIT AGRAWAL</text>
  <text x="132" y="228" font-family="JetBrains Mono, monospace" font-size="20" fill="#93A8CD">Software Engineer Intern @ DrongoAI</text>

  <rect x="132" y="255" width="480" height="280" rx="22" fill="#0E121C" stroke="#262B3C"/>
  <text x="160" y="295" font-family="JetBrains Mono, monospace" font-size="16" fill="#F5C16C">$ mode --ship</text>
  <text x="160" y="327" font-family="JetBrains Mono, monospace" font-size="18" fill="#E6E7EA">MERN stack + product-speed execution</text>
  <text x="160" y="375" font-family="JetBrains Mono, monospace" font-size="16" fill="#F5C16C">$ focus --today</text>
  <text x="160" y="407" font-family="JetBrains Mono, monospace" font-size="18" fill="#E6E7EA">clean architecture, readable systems</text>
  <text x="160" y="455" font-family="JetBrains Mono, monospace" font-size="16" fill="#F5C16C">$ learning --now</text>
  <text x="160" y="487" font-family="JetBrains Mono, monospace" font-size="18" fill="#E6E7EA">python for machine learning</text>

  <g transform="translate(700 170)">
    <ellipse cx="180" cy="70" rx="120" ry="50" fill="#FFD58B" opacity="0.45" filter="url(#blurGlow)">
      <animate attributeName="opacity" values="0.25;0.55;0.25" dur="2.8s" repeatCount="indefinite"/>
    </ellipse>

    <rect x="115" y="80" width="130" height="210" rx="24" fill="#121827" stroke="#5E6A86" stroke-width="2"/>
    <rect x="128" y="118" width="104" height="145" rx="18" fill="url(#liquid)">
      <animate attributeName="y" values="118;114;118" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="height" values="145;149;145" dur="2.2s" repeatCount="indefinite"/>
    </rect>

    <path d="M132 135 C154 126, 206 126, 228 135" fill="none" stroke="#FFE0B4" stroke-width="4" opacity="0.7">
      <animate attributeName="d" dur="2.2s" repeatCount="indefinite"
        values="M132 135 C154 126, 206 126, 228 135;
                M132 139 C154 130, 206 130, 228 139;
                M132 135 C154 126, 206 126, 228 135"/>
    </path>

    <rect x="101" y="86" width="8" height="195" rx="4" fill="#DCE3F7" opacity="0.55"/>
    <rect x="251" y="86" width="8" height="195" rx="4" fill="#DCE3F7" opacity="0.55"/>

    <text x="180" y="345" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="19" fill="#F7C777">CODER WHISKEY CARD</text>
  </g>

  <circle cx="980" cy="128" r="4" fill="#7BE0FF">
    <animate attributeName="cy" values="128;120;128" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1010" cy="154" r="3" fill="#C5FF4A">
    <animate attributeName="cy" values="154;146;154" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1042" cy="130" r="2.5" fill="#FFD38A">
    <animate attributeName="cy" values="130;122;130" dur="2.6s" repeatCount="indefinite"/>
  </circle>
</svg>
