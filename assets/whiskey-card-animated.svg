<svg width="1200" height="680" viewBox="0 0 1200 680" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0D12"/>
      <stop offset="100%" stop-color="#07090E"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DDAA4B"/>
      <stop offset="50%" stop-color="#7B5422"/>
      <stop offset="100%" stop-color="#DDAA4B"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DDE8FF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#6B7D9A" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6C77D"/>
      <stop offset="45%" stop-color="#D79335"/>
      <stop offset="100%" stop-color="#8F4E12"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="70" y="50" width="1060" height="580" rx="34" fill="url(#bg)" stroke="url(#frame)" stroke-width="2"/>

  <rect x="112" y="92" width="350" height="28" rx="14" fill="#121725"/>
  <text x="287" y="111" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="1.2" fill="#DDAA4B">CYBER RESERVE DEVELOPER CARD</text>

  <text x="112" y="182" font-family="JetBrains Mono, monospace" font-size="58" font-weight="700" fill="#E9ECF4">UDIT AGRAWAL</text>
  <text x="114" y="220" font-family="JetBrains Mono, monospace" font-size="20" fill="#5ED8FF">Software Engineer Intern @ DrongoAI</text>

  <rect x="112" y="254" width="500" height="296" rx="24" fill="#0F1420" stroke="#27324A"/>
  <text x="140" y="295" font-family="JetBrains Mono, monospace" font-size="16" fill="#DDAA4B">$ profile --status</text>
  <text x="140" y="328" font-family="JetBrains Mono, monospace" font-size="18" fill="#E9ECF4">MERN engineering + clean architecture</text>
  <text x="140" y="374" font-family="JetBrains Mono, monospace" font-size="16" fill="#DDAA4B">$ velocity --mode</text>
  <text x="140" y="407" font-family="JetBrains Mono, monospace" font-size="18" fill="#E9ECF4">ship fast, keep systems maintainable</text>
  <text x="140" y="453" font-family="JetBrains Mono, monospace" font-size="16" fill="#DDAA4B">$ research --track</text>
  <text x="140" y="486" font-family="JetBrains Mono, monospace" font-size="18" fill="#E9ECF4">python for ml-driven product features</text>

  <g transform="translate(690 132)" filter="url(#shadow)">
    <ellipse cx="190" cy="350" rx="170" ry="28" fill="#040507"/>
    <ellipse cx="190" cy="350" rx="120" ry="16" fill="#0D1017"/>

    <path d="M95 88 C100 64, 125 52, 154 52 H226 C255 52, 280 64, 285 88 L305 300 C309 327, 289 350, 261 350 H119 C91 350, 71 327, 75 300 Z"
      fill="url(#glass)" stroke="#9AB0D3" stroke-opacity="0.45" stroke-width="2"/>

    <path d="M106 186 C114 173, 132 165, 152 165 H228 C248 165, 266 173, 274 186 L286 297 C289 316, 275 332, 255 332 H125 C105 332, 91 316, 94 297 Z"
      fill="url(#liquid)">
      <animate attributeName="d" dur="2.8s" repeatCount="indefinite"
        values="
        M106 186 C114 173, 132 165, 152 165 H228 C248 165, 266 173, 274 186 L286 297 C289 316, 275 332, 255 332 H125 C105 332, 91 316, 94 297 Z;
        M106 191 C114 178, 132 170, 152 170 H228 C248 170, 266 178, 274 191 L286 299 C289 318, 275 334, 255 334 H125 C105 334, 91 318, 94 299 Z;
        M106 186 C114 173, 132 165, 152 165 H228 C248 165, 266 173, 274 186 L286 297 C289 316, 275 332, 255 332 H125 C105 332, 91 316, 94 297 Z"/>
    </path>

    <path d="M116 190 C132 181, 248 181, 264 190" stroke="#FFE1B1" stroke-width="4" opacity="0.72">
      <animate attributeName="d" dur="2.8s" repeatCount="indefinite"
        values="
        M116 190 C132 181, 248 181, 264 190;
        M116 194 C132 185, 248 185, 264 194;
        M116 190 C132 181, 248 181, 264 190"/>
    </path>

    <rect x="118" y="120" width="13" height="210" rx="6" fill="#D9E6FF" fill-opacity="0.48"/>
    <rect x="250" y="120" width="10" height="200" rx="5" fill="#EBF3FF" fill-opacity="0.34"/>
    <rect x="244" y="100" width="15" height="210" rx="7" fill="#D9E6FF" fill-opacity="0.28"/>

    <rect x="136" y="215" width="28" height="28" rx="5" fill="#FFE7BF" fill-opacity="0.32" transform="rotate(-12 136 215)">
      <animateTransform attributeName="transform" type="rotate" values="-12 150 229;-6 150 229;-12 150 229" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="224" y="238" width="24" height="24" rx="5" fill="#FFE7BF" fill-opacity="0.25" transform="rotate(8 224 238)">
      <animateTransform attributeName="transform" type="rotate" values="8 236 250;14 236 250;8 236 250" dur="2.9s" repeatCount="indefinite"/>
    </rect>

    <ellipse cx="200" cy="92" rx="130" ry="72" fill="#57D6FF" fill-opacity="0.13" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.18;0.35;0.18" dur="2.6s" repeatCount="indefinite"/>
    </ellipse>
