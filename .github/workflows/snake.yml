name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ff3aa4&color_dots=%23ebedf0,%23d9cbff,%23a98bff,%237b07ff,%232f07d1
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23ff3aa4&color_dots=%23190a48,%232f07d1,%237b07ff,%23d126ff,%237cf8ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
